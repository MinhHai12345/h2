spring:
  application:
    name: h2-football
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:h2_football}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USERNAME:h2football}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    auto-startup: true
    wait-for-jobs-to-complete-on-shutdown: true
    overwrite-existing-jobs: false
    properties:
      org:
        quartz:
          scheduler:
            instanceName: H2QuartzScheduler
            instanceId: AUTO
          threadPool:
            threadCount: ${WORKFLOW_MAX_PARALLELISM:4}
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: ${QUARTZ_CLUSTERED:false}
            clusterCheckinInterval: ${QUARTZ_CLUSTER_CHECKIN_INTERVAL:15000}
            misfireThreshold: ${QUARTZ_MISFIRE_THRESHOLD:60000}
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  time-zone: ${APP_TIME_ZONE:UTC}
  workflow:
    recovery-delay-millis: ${WORKFLOW_RECOVERY_DELAY_MILLIS:60000}
    data-readiness:
      stale-after-hours: ${WORKFLOW_DATA_STALE_AFTER_HOURS:72}
  ingestion:
    operations:
      api-key: ${INGESTION_ADMIN_API_KEY:}
    sofascore:
      job:
        enabled: ${SOFASCORE_INGESTION_JOB_ENABLED:false}
        cron: ${SOFASCORE_INGESTION_JOB_CRON:0 15 2 * * ?}
        run-on-startup: ${SOFASCORE_INGESTION_JOB_RUN_ON_STARTUP:false}
        match-details:
          enabled: ${SOFASCORE_MATCH_DETAILS_ENABLED:false}
          retry-attempts: ${SOFASCORE_MATCH_DETAILS_RETRY_ATTEMPTS:3}
          retry-delay-millis: ${SOFASCORE_MATCH_DETAILS_RETRY_DELAY_MILLIS:1000}
        seasons: []
        league-catalogue:
          enabled: ${SOFASCORE_LEAGUE_CATALOGUE_JOB_ENABLED:false}
          cron: ${SOFASCORE_LEAGUE_CATALOGUE_JOB_CRON:0 0 2 * * ?}
          run-on-startup: ${SOFASCORE_LEAGUE_CATALOGUE_JOB_RUN_ON_STARTUP:false}
          tournament-ids: []
  providers:
    sofascore:
      enabled: ${SOFASCORE_ENABLED:false}
      web-url: ${SOFASCORE_WEB_URL:https://www.sofascore.com}
      region: ${SOFASCORE_REGION:VN}
      headless: ${SOFASCORE_HEADLESS:true}
      browser-channel: ${SOFASCORE_BROWSER_CHANNEL:chrome}
      profile-directory: ${SOFASCORE_PROFILE_DIRECTORY:.runtime/sofascore-profile}
      navigation-timeout-millis: ${SOFASCORE_NAVIGATION_TIMEOUT_MILLIS:60000}
      response-timeout-millis: ${SOFASCORE_RESPONSE_TIMEOUT_MILLIS:20000}
    understat:
      enabled: ${UNDERSTAT_ENABLED:false}
    football-data:
      enabled: ${FOOTBALL_DATA_ENABLED:false}
      api-key: ${FOOTBALL_DATA_API_KEY:}
      cron: ${FOOTBALL_DATA_INGESTION_CRON:0 0 3 * * ?}
      run-on-startup: ${FOOTBALL_DATA_INGESTION_RUN_ON_STARTUP:false}
      seasons: []
    football-data-uk:
      enabled: ${FOOTBALL_DATA_UK_ENABLED:false}
