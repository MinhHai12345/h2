name: Code Quality

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  java-quality:
    name: Java 17 tests and format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests and check formatting
        run: mvn --batch-mode --no-transfer-progress test spotless:check
