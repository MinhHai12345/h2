services:
  mysql:
    image: mysql:8.4
    container_name: h2-football-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-h2_football}
      MYSQL_USER: ${DB_USERNAME:-h2football}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
      TZ: UTC
    ports:
      - "${DB_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - h2-football-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  h2-football-mysql-data:
